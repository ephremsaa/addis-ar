<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Addis AR · Live 3D Product Scanner</title>
  <!-- A-Frame library -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
  <!-- AR.js for A-Frame -->
  <script src="../build/aframe-ar.js"></script>

  <style>
    :root {
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: var(--text);
    }

    /* Top Navigation HUD */
    .scanner-top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px 16px;
      background: linear-gradient(180deg, rgba(9, 13, 22, 0.92) 0%, rgba(9, 13, 22, 0.6) 75%, transparent 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-back:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.22);
    }

    .scanner-title-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .scanner-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    /* Scanning Status Banner */
    .scan-status-pill {
      position: fixed;
      top: calc(66px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #e2e8f0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .scan-status-pill.detected {
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }

    /* Viewfinder Reticle */
    .viewfinder {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(72vw, 280px);
      height: min(72vw, 280px);
      z-index: 500;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .viewfinder.locked {
      opacity: 0.4;
    }

    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: var(--primary);
      border-style: solid;
      border-width: 0;
    }

    .corner-tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 8px; }
    .corner-tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 8px; }
    .corner-bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 8px; }
    .corner-br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 8px; }

    .laser-line {
      position: absolute;
      top: 0;
      left: 6px;
      right: 6px;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--primary) 50%, transparent 100%);
      box-shadow: 0 0 10px var(--primary);
      animation: laserSweep 2.2s ease-in-out infinite alternate;
    }

    @keyframes laserSweep {
      0% { top: 5%; opacity: 0.3; }
      50% { opacity: 1; }
      100% { top: 95%; opacity: 0.3; }
    }

    /* Bottom Control Bar & Product Switcher */
    .scanner-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom)) 16px;
      background: linear-gradient(0deg, rgba(9, 13, 22, 0.95) 0%, rgba(9, 13, 22, 0.7) 80%, transparent 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Product Selector Scroll */
    .product-carousel {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px;
    }

    .product-carousel::-webkit-scrollbar {
      display: none;
    }

    .product-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .product-chip.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .product-chip:active {
      transform: scale(0.95);
    }

    /* Active Product Card */
    .active-product-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
    }

    .card-meta .price {
      color: var(--gold);
      font-weight: 700;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      padding: 7px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .action-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.2);
    }

    .action-btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--primary);
      color: #38bdf8;
    }

    /* Hiro Marker Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-content h3 {
      font-size: 1.05rem;
      margin-bottom: 8px;
      color: #fff;
    }

    .modal-content p {
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .modal-content img {
      width: 190px;
      height: 190px;
      border-radius: 12px;
      border: 3px solid #fff;
      background: #fff;
      display: block;
      margin: 0 auto 16px auto;
    }

    .btn-close-modal {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      background: var(--primary);
      color: #04101d;
      font-weight: 700;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <!-- Top Bar -->
  <header class="scanner-top-bar">
    <a href="../../index.html" class="btn-back">
      <span>&larr;</span>
      <span>Addis AR</span>
    </a>

    <div class="scanner-title-group">
      <div class="scanner-badge">
        <span class="live-dot" id="live-indicator"></span>
        <span>PRODUCT SCANNER</span>
      </div>
    </div>

    <button class="btn-icon" id="btn-show-marker" title="Target Marker">
      <span>🎯</span>
    </button>
  </header>

  <!-- Live Status Pill -->
  <div class="scan-status-pill" id="status-pill">
    <span id="status-icon">🔍</span>
    <span id="status-text">Align Hiro marker in camera</span>
  </div>

  <!-- Viewfinder reticle overlay -->
  <div class="viewfinder" id="viewfinder">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="laser-line"></div>
  </div>

  <!-- Bottom Bar: Switch Products & Controls -->
  <footer class="scanner-bottom-bar">
    <!-- Carousel of selectable products -->
    <div class="product-carousel">
      <button class="product-chip active" data-product="coffee">
        <span>☕</span>
        <span>Addis Coffee Jebena</span>
      </button>
      <button class="product-chip" data-product="chair">
        <span>🛋️</span>
        <span>Nordic Chair</span>
      </button>
      <button class="product-chip" data-product="burger">
        <span>🍔</span>
        <span>Deluxe Burger</span>
      </button>
      <button class="product-chip" data-product="audio">
        <span>🎧</span>
        <span>Hi-Fi Headphones</span>
      </button>
      <button class="product-chip" data-product="gem">
        <span>💎</span>
        <span>Holo Prism</span>
      </button>
    </div>

    <!-- Active Product Card -->
    <div class="active-product-card">
      <div class="card-info">
        <span class="card-name" id="prod-name">Addis Coffee Jebena Set</span>
        <div class="card-meta">
          <span class="price" id="prod-price">Free AR Spec</span>
          <span>·</span>
          <span id="prod-desc">Traditional Clay & Woven Mesob</span>
        </div>
      </div>
      <div class="card-actions">
        <button class="action-btn" id="btn-spin-toggle" title="Toggle Auto-Spin">
          <span>🔄</span>
          <span>Spin</span>
        </button>
        <button class="action-btn" id="btn-mode-toggle" title="Switch Marker / Space Mode">
          <span id="mode-icon">📍</span>
          <span id="mode-label">Space</span>
        </button>
      </div>
    </div>
  </footer>

  <!-- Marker Target Modal -->
  <div class="modal-backdrop" id="marker-modal">
    <div class="modal-content">
      <h3>🎯 Hiro AR Marker</h3>
      <p>Point this camera at this pattern on another screen, or print it, to anchor 3D products in true AR space.</p>
      <img src="../../data/images/HIRO.jpg" alt="Hiro Marker">
      <button class="btn-close-modal" id="btn-close-modal">Got it</button>
    </div>
  </div>

  <!-- A-Frame AR.js Scene -->
  <!-- Note: debugUIEnabled: false completely disables the grey trackingBackend / markersAreaEnabled debug overlay -->
  <a-scene embedded
           vr-mode-ui="enabled: false;"
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <!-- ==================== MODE 1: MARKER ANCHORED PRODUCT ==================== -->
    <a-marker id="hiro-marker" preset="hiro">
      <a-entity id="marker-product-group" position="0 0.1 0" rotation="0 0 0" scale="1 1 1">
        <!-- Products will be dynamically mounted here -->
      </a-entity>
    </a-marker>

    <!-- ==================== MODE 2: SPACE ANCHORED PRODUCT (Direct Camera Fallback) ==================== -->
    <a-entity id="space-product-group" position="0 0 -1.6" rotation="0 0 0" scale="0.7 0.7 0.7" visible="false">
      <!-- Attached dynamically when in Free Space Mode -->
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Product 3D Models Definition in A-Frame HTML templates
    const PRODUCTS = {
      coffee: {
        name: "Addis Coffee Jebena Set",
        price: "ETB 950",
        desc: "Traditional Clay & Woven Mesob",
        render: () => `
          <!-- Ornate Mesob Tray Base -->
          <a-cylinder position="0 0 0" radius="0.7" height="0.08" color="#854d0e" material="roughness: 0.6; metalness: 0.2">
            <a-ring position="0 0.045 0" rotation="-90 0 0" radius-inner="0.25" radius-outer="0.65" color="#ca8a04"></a-ring>
          </a-cylinder>

          <!-- Traditional Jebena (Coffee Pot) -->
          <a-entity id="jebena" position="0 0.1 0">
            <!-- Round Bottom Sphere -->
            <a-sphere position="0 0.35 0" radius="0.32" color="#3e2723" material="roughness: 0.4; metalness: 0.3"></a-sphere>
            <!-- Pot Neck -->
            <a-cylinder position="0 0.7 0" radius="0.09" height="0.4" color="#271c19"></a-cylinder>
            <!-- Gold Neck Ring -->
            <a-torus position="0 0.65 0" rotation="90 0 0" radius="0.10" radius-tubular="0.015" color="#f59e0b" material="metalness: 0.8; roughness: 0.2"></a-torus>
            <!-- Spout -->
            <a-cylinder position="0.25 0.5 0" rotation="0 0 -45" radius="0.04" height="0.35" color="#3e2723"></a-cylinder>
            <!-- Handle -->
            <a-torus position="-0.22 0.5 0" rotation="0 90 0" radius="0.16" radius-tubular="0.025" color="#3e2723"></a-torus>
            <!-- Straw Stopper Top -->
            <a-cone position="0 0.95 0" radius-bottom="0.09" radius-top="0.01" height="0.16" color="#d97706"></a-cone>
          </a-entity>

          <!-- Traditional Sini Coffee Cups -->
          <a-entity position="0.4 0.08 0.2">
            <a-cylinder radius="0.09" height="0.1" color="#fafaf9"></a-cylinder>
            <a-cylinder position="0 0.05 0" radius="0.08" height="0.02" color="#3e2723"></a-cylinder>
          </a-entity>
          <a-entity position="-0.38 0.08 0.22">
            <a-cylinder radius="0.09" height="0.1" color="#fafaf9"></a-cylinder>
            <a-cylinder position="0 0.05 0" radius="0.08" height="0.02" color="#3e2723"></a-cylinder>
          </a-entity>
        `
      },
      chair: {
        name: "Nordic Lounge Chair",
        price: "$280.00",
        desc: "Oak Legs · Emerald Velour Seat",
        render: () => `
          <!-- Seat Cushion -->
          <a-box position="0 0.35 0" width="0.75" height="0.1" depth="0.7" color="#047857" material="roughness: 0.8"></a-box>
          <!-- Backrest -->
          <a-box position="0 0.72 -0.32" rotation="-12 0 0" width="0.75" height="0.65" depth="0.08" color="#047857" material="roughness: 0.8"></a-box>
          <!-- 4 Angled Wooden Legs -->
          <a-cylinder position="-0.3 0.16 0.28" rotation="8 0 -8" radius="0.025" height="0.35" color="#78350f"></a-cylinder>
          <a-cylinder position="0.3 0.16 0.28" rotation="8 0 8" radius="0.025" height="0.35" color="#78350f"></a-cylinder>
          <a-cylinder position="-0.3 0.16 -0.28" rotation="-8 0 -8" radius="0.025" height="0.35" color="#78350f"></a-cylinder>
          <a-cylinder position="0.3 0.16 -0.28" rotation="-8 0 8" radius="0.025" height="0.35" color="#78350f"></a-cylinder>
          <!-- Soft Pillow -->
          <a-box position="0 0.44 -0.2" rotation="20 0 0" width="0.45" height="0.25" depth="0.12" color="#10b981"></a-box>
        `
      },
      burger: {
        name: "Gourmet Double Burger",
        price: "$14.50",
        desc: "Brioche Bun · Cheddar · Angus Beef",
        render: () => `
          <!-- Serving Board -->
          <a-cylinder position="0 0 0" radius="0.65" height="0.05" color="#573010"></a-cylinder>
          <!-- Bottom Bun -->
          <a-cylinder position="0 0.08 0" radius="0.38" height="0.1" color="#d97706"></a-cylinder>
          <!-- Beef Patty 1 -->
          <a-cylinder position="0 0.16 0" radius="0.4" height="0.07" color="#3e2723"></a-cylinder>
          <!-- Melted Cheddar Cheese -->
          <a-box position="0 0.21 0" rotation="0 25 0" width="0.55" height="0.03" depth="0.55" color="#eab308"></a-box>
          <!-- Beef Patty 2 -->
          <a-cylinder position="0 0.26 0" radius="0.4" height="0.07" color="#3e2723"></a-cylinder>
          <!-- Fresh Lettuce Ring -->
          <a-torus position="0 0.31 0" rotation="90 0 0" radius="0.36" radius-tubular="0.035" color="#16a34a"></a-torus>
          <!-- Sliced Tomatoes -->
          <a-cylinder position="0.12 0.35 0.05" radius="0.14" height="0.03" color="#dc2626"></a-cylinder>
          <a-cylinder position="-0.12 0.35 -0.05" radius="0.14" height="0.03" color="#dc2626"></a-cylinder>
          <!-- Top Sesame Brioche Dome -->
          <a-sphere position="0 0.42 0" radius="0.39" color="#d97706" phi-length="360" theta-start="0" theta-length="90"></a-sphere>
        `
      },
      audio: {
        name: "Hi-Fi Spatial Headphones",
        price: "$199.00",
        desc: "Over-Ear · Active Noise Cancellation",
        render: () => `
          <!-- Headband Arc -->
          <a-torus position="0 0.5 0" rotation="0 0 0" radius="0.35" radius-tubular="0.035" arc="180" color="#1e293b" material="metalness: 0.8; roughness: 0.2"></a-torus>
          <!-- Left Ear Cup Assembly -->
          <a-cylinder position="-0.38 0.45 0" rotation="0 0 90" radius="0.14" height="0.12" color="#0f172a">
            <a-torus position="0 0 0" rotation="0 90 0" radius="0.12" radius-tubular="0.02" color="#38bdf8" material="emissive: #38bdf8; emissiveIntensity: 0.8"></a-torus>
          </a-cylinder>
          <!-- Right Ear Cup Assembly -->
          <a-cylinder position="0.38 0.45 0" rotation="0 0 90" radius="0.14" height="0.12" color="#0f172a">
            <a-torus position="0 0 0" rotation="0 90 0" radius="0.12" radius-tubular="0.02" color="#38bdf8" material="emissive: #38bdf8; emissiveIntensity: 0.8"></a-torus>
          </a-cylinder>
          <!-- Chrome Headband Accent -->
          <a-torus position="0 0.52 0" radius="0.36" radius-tubular="0.015" arc="160" color="#94a3b8" material="metalness: 0.95; roughness: 0.1"></a-torus>
        `
      },
      gem: {
        name: "Neon Hologram Prism",
        price: "Interactive FX",
        desc: "Procedural Cyber Gem & Orbit Ring",
        render: () => `
          <a-entity position="0 0.4 0">
            <a-octahedron radius="0.35" color="#06b6d4" material="roughness: 0.1; metalness: 0.9; wireframe: false"
                           animation="property: rotation; to: 360 360 0; dur: 4000; easing: linear; loop: true"></a-octahedron>
            <a-torus rotation="45 45 0" radius="0.55" radius-tubular="0.015" color="#f43f5e" material="emissive: #f43f5e; emissiveIntensity: 0.8"
                     animation="property: rotation; to: -45 -45 360; dur: 3000; easing: linear; loop: true"></a-torus>
            <a-ring rotation="-90 0 0" radius-inner="0.6" radius-outer="0.63" color="#38bdf8" material="emissive: #38bdf8"></a-ring>
          </a-entity>
        `
      }
    };

    let currentProductKey = 'coffee';
    let isFreeSpaceMode = false;
    let isAutoSpinning = true;
    let spinAngle = 0;

    const markerGroup = document.getElementById('marker-product-group');
    const spaceGroup = document.getElementById('space-product-group');
    const statusPill = document.getElementById('status-pill');
    const statusText = document.getElementById('status-text');
    const statusIcon = document.getElementById('status-icon');
    const viewfinder = document.getElementById('viewfinder');
    const liveIndicator = document.getElementById('live-indicator');
    const hiroMarker = document.getElementById('hiro-marker');

    const prodName = document.getElementById('prod-name');
    const prodPrice = document.getElementById('prod-price');
    const prodDesc = document.getElementById('prod-desc');
    const btnSpinToggle = document.getElementById('btn-spin-toggle');
    const btnModeToggle = document.getElementById('btn-mode-toggle');
    const modeIcon = document.getElementById('mode-icon');
    const modeLabel = document.getElementById('mode-label');

    // Mount product HTML
    function loadProduct(key) {
      currentProductKey = key;
      const prod = PRODUCTS[key];
      if (!prod) return;

      const html = prod.render();
      markerGroup.innerHTML = html;
      spaceGroup.innerHTML = html;

      prodName.textContent = prod.name;
      prodPrice.textContent = prod.price;
      prodDesc.textContent = prod.desc;

      document.querySelectorAll('.product-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.product === key);
      });
    }

    // Carousel selection
    document.querySelectorAll('.product-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        loadProduct(chip.dataset.product);
      });
    });

    // Auto spin loop
    function animate() {
      if (isAutoSpinning) {
        spinAngle = (spinAngle + 0.8) % 360;
        markerGroup.setAttribute('rotation', `0 ${spinAngle} 0`);
        spaceGroup.setAttribute('rotation', `0 ${spinAngle} 0`);
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Spin toggle button
    btnSpinToggle.addEventListener('click', () => {
      isAutoSpinning = !isAutoSpinning;
      btnSpinToggle.classList.toggle('active', isAutoSpinning);
    });

    // Switch between Marker tracking and Free-Space direct projection
    btnModeToggle.addEventListener('click', () => {
      isFreeSpaceMode = !isFreeSpaceMode;
      if (isFreeSpaceMode) {
        spaceGroup.setAttribute('visible', 'true');
        modeIcon.textContent = '🎯';
        modeLabel.textContent = 'Marker';
        btnModeToggle.classList.add('active');
        statusPill.classList.add('detected');
        statusIcon.textContent = '📍';
        statusText.textContent = 'Space Mode: Product placed in front of camera';
        viewfinder.classList.add('locked');
      } else {
        spaceGroup.setAttribute('visible', 'false');
        modeIcon.textContent = '📍';
        modeLabel.textContent = 'Space';
        btnModeToggle.classList.remove('active');
        statusPill.classList.remove('detected');
        statusIcon.textContent = '🔍';
        statusText.textContent = 'Align Hiro marker in camera';
        viewfinder.classList.remove('locked');
      }
    });

    // AR.js Marker Detection Events
    hiroMarker.addEventListener('markerFound', () => {
      if (!isFreeSpaceMode) {
        statusPill.classList.add('detected');
        statusIcon.textContent = '✨';
        statusText.textContent = `Product Locked: ${PRODUCTS[currentProductKey].name}`;
        viewfinder.classList.add('locked');
        liveIndicator.style.background = '#10b981';
      }
    });

    hiroMarker.addEventListener('markerLost', () => {
      if (!isFreeSpaceMode) {
        statusPill.classList.remove('detected');
        statusIcon.textContent = '🔍';
        statusText.textContent = 'Align Hiro marker in camera';
        viewfinder.classList.remove('locked');
        liveIndicator.style.background = '#f59e0b';
      }
    });

    // Modal target marker popup
    const modal = document.getElementById('marker-modal');
    document.getElementById('btn-show-marker').addEventListener('click', () => {
      modal.classList.add('open');
    });
    document.getElementById('btn-close-modal').addEventListener('click', () => {
      modal.classList.remove('open');
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });

    // Initialize first product
    loadProduct('coffee');
  </script>
</body>
</html>
